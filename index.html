<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Mood-Matcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>Mood Matcher</h1>
    <form id = "mood-form">
    <select id = "mood" name = "mood">
        <option value="" disabled selected>Select a Mood</option>
        <option value = "happy">Happy</option>
        <option value = "sad">Sad</option>
        <option value = "adventurous">Adventurous</option>
        <option value = "sleepy">Sleepy</option>
        <option value = "spooky">Spooky</option>
        <option value = "romantic">Romantic</option>
        <option value = "funny">Funny</option>
        <option value = "crazy">Crazy</option>
        <option value = "intense">Intense</option>
        <option value = 'angry'>Angry</option>
        <option value = "curious">Curious</option>
        <option value = "tired">Tired</option>
        <option value = "jealous">Jealous</option>
        <option value = "melancholy">Melancholy</option>
    </select>
    <button type= "submit">Search</button>
    <p>Status:</p>
    <select id="status" name="status">
      <option value="all">All</option>
      <option value="Running">Running</option>
      <option value="Ended">Ended</option>
      <option value="To Be Determined">TBD</option>
    </select>
    <p>Sort By Rating:</p>
    <select id="rating" name="rating">
      <option value="all">All</option>
      <option value="highest">Top Rated</option>
      <option value="lowest">Lowest Rated</option>
    </select>
    </form>
    <button id="clear">Clear Search</button>
    <div id="recs" class="cards"></div>
    <div id='watchlist'>
      <h2>My Watchlist:</h2>
      <div id="watchlist-items"></div>
    </div>
  </body>
</html>
